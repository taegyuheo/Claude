<script type="text/plain" id="src">
/* 01_blink.c — libgpiod v2 로 LED 깜빡이기 (객체 흐름을 한 단계씩 직접 작성)
 * 배선: GPIO17 → 220Ω → LED → GND
 * 빌드: make 01_blink      실행: ./01_blink      종료: Ctrl+C
 */
#include <gpiod.h>
#include <signal.h>
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <time.h>

#define CHIP_PATH "/dev/gpiochip0"
#define LED_LINE  17

static volatile sig_atomic_t g_stop = 0;
static void on_sigint(int sig) { (void)sig; g_stop = 1; }

int main(void)
{
    unsigned int offset = LED_LINE;
    int ret = EXIT_FAILURE;

    /* Ctrl+C → g_stop = 1 → 루프 종료 → 아래에서 라인 반납 */
    struct sigaction sa;
    memset(&sa, 0, sizeof sa);
    sa.sa_handler = on_sigint;
    sigaction(SIGINT, &sa, NULL);

    /* ① 칩 열기 */
    struct gpiod_chip *chip = gpiod_chip_open(CHIP_PATH);
    if (!chip) { perror("gpiod_chip_open"); return EXIT_FAILURE; }

    /* ② 라인 하나에 줄 설정: 출력, 처음 값 0 */
    struct gpiod_line_settings *settings = gpiod_line_settings_new();
    gpiod_line_settings_set_direction(settings, GPIOD_LINE_DIRECTION_OUTPUT);
    gpiod_line_settings_set_output_value(settings, GPIOD_LINE_VALUE_INACTIVE);

    /* ③ 어떤 라인(offset)에 그 설정을 쓸지 묶기 */
    struct gpiod_line_config *line_cfg = gpiod_line_config_new();
    gpiod_line_config_add_line_settings(line_cfg, &offset, 1, settings);

    /* ④ 요청 전체에 대한 설정: consumer 이름 (gpioinfo 에 보임) */
    struct gpiod_request_config *req_cfg = gpiod_request_config_new();
    gpiod_request_config_set_consumer(req_cfg, "blink");

    /* ⑤ 커널에 요청 → 성공하면 이 프로세스가 라인의 소유자 */
    struct gpiod_line_request *req = gpiod_chip_request_lines(chip, req_cfg, line_cfg);
    if (!req) { perror("gpiod_chip_request_lines"); goto cleanup; }

    printf("GPIO%d 깜빡임 시작 (Ctrl+C 로 종료)\n", LED_LINE);
    int on = 0;
    while (!g_stop) {
        on = !on;
        gpiod_line_request_set_value(req, offset,
            on ? GPIOD_LINE_VALUE_ACTIVE : GPIOD_LINE_VALUE_INACTIVE);
        struct timespec ts = { 0, 500 * 1000000L };      /* 0.5초 */
        nanosleep(&ts, NULL);
    }

    gpiod_line_request_set_value(req, offset, GPIOD_LINE_VALUE_INACTIVE);   /* 끄고 나가기 */
    gpiod_line_request_release(req);                                       /* ⑥ 반납 */
    printf("\n라인 반납 완료\n");
    ret = EXIT_SUCCESS;

cleanup:
    gpiod_request_config_free(req_cfg);
    gpiod_line_config_free(line_cfg);
    gpiod_line_settings_free(settings);
    gpiod_chip_close(chip);
    return ret;
}
</script>

/* 코드 속 이름 → 심볼 키 */
const ALIAS = {
  sig_atomic_t:'g_stop', timespec:'ts', sa:'sigaction', sa_handler:'sigaction',
  gpiod_chip:'chip', gpiod_line_settings:'settings', gpiod_line_config:'line_cfg',
  gpiod_request_config:'req_cfg', gpiod_line_request:'req',
  GPIOD_LINE_VALUE_INACTIVE:'GPIOD_LINE_VALUE_ACTIVE',
  goto:'cleanup', EXIT_SUCCESS:'EXIT_FAILURE',
};

/* ============================================================
 * 3. 엔진 (모든 파일 공통 — 수정하면 모든 결과물을 다시 빌드)
 * ============================================================ */
function roleOfLine(n) { const s = SECTIONS.find(s => n >= s.from && n <= s.to); return s ? s.role : ''; }

function regDiagram(name) {
  const r = REGS[name];
  let idx = '', cells = '';
  for (let b = 31; b >= 0; b--) {
    idx += `<div class="bit idx">${b}</div>`;
    let cls = 'bit', ch = r.zero ? '0' : '·';
    if (b >= r.hl.lo && b <= r.hl.hi) { cls += ' hl'; ch = r.hl.bits[r.hl.hi - b]; }
    else if (r.fields && r.fields.some(f => b >= f.lo && b <= f.hi && f.label !== '예약' && (Math.floor(b/3)%2))) cls += ' fld';
    cells += `<div class="${cls}">${ch}</div>`;
  }
  return `
  <div class="border border-slate-200 rounded-lg p-3 my-3">
    <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-2">
      <span class="mono font-bold text-sky-700 link" data-go="REG_${name}">${name}</span>
      <span class="text-xs text-slate-500">${r.title}</span>
      <span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 mono">${r.access}</span>
    </div>
    <div class="grid grid-cols-3 gap-2 text-xs mono mb-2">
      <div><div class="text-slate-400">오프셋</div>+${hex(r.off,2)}</div>
      <div><div class="text-slate-400">물리 주소</div>${hex(GPIO_PHYS + r.off)}</div>
      <div><div class="text-slate-400">버스 주소</div>${hex(GPIO_BUS + r.off)}</div>
    </div>
    <div class="overflow-x-auto"><div class="bits mono">${idx}${cells}</div></div>
    <div class="text-xs mt-2 text-sky-700 font-semibold">${r.hl.label}</div>
  </div>`;
}

const OPS = { '!':'op_not', '?':'op_ternary', '&':'op_addr' };

const KIND = {
  func:{ label:'함수', cls:'bg-sky-100 text-sky-800' }, var:{ label:'변수', cls:'bg-emerald-100 text-emerald-800' },
  macro:{ label:'매크로', cls:'bg-yellow-100 text-yellow-800' }, const:{ label:'상수', cls:'bg-teal-100 text-teal-800' },
  type:{ label:'타입', cls:'bg-cyan-100 text-cyan-800' }, op:{ label:'연산자', cls:'bg-rose-100 text-rose-800' },
  kw:{ label:'키워드', cls:'bg-violet-100 text-violet-800' }, reg:{ label:'레지스터', cls:'bg-slate-800 text-white' },
};

/* ============================================================
 * 4. 구문 강조 + 클릭 가능한 심볼
 * ============================================================ */
const KW = new Set('int unsigned static volatile void struct return while goto if else for const char long sizeof'.split(' '));
const SRC = document.getElementById('src').textContent.replace(/\r\n/g, '\n').replace(/^\n/, '').replace(/\s+$/, '');
const OCC = {};   // 심볼 → 등장 줄 번호

function renderCode() {
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\\n])*")|(<[\w.\/]+\.h>)|(#\s*\w+)|(\b(?:0x[0-9a-fA-F]+|\d+)[uUlL]*\b)|([A-Za-z_]\w*)|(\n)|([\s\S])/g;
  const lines = [[]];
  let m, ln = 1;
  const push = (html) => lines[lines.length - 1].push(html);
  const mark = (key, text, kind) => {
    (OCC[key] ||= new Set()).add(ln);
    return `<span class="sym k-${kind}" data-sym="${key}">${esc(text)}</span>`;
  };
  /* 주석은 파일 머리 주석(첫 #include 위)만 보여 준다.
   * 나머지 주석은 지우고, 주석만 있던 줄은 숨긴다 → 줄 번호는 원본 그대로 유지 */
  const headerEnd = SRC.indexOf('#include');
  const hidden = new Set();                      // 숨길 줄 번호
  while ((m = re.exec(SRC))) {
    const [t, com, str, hdr, pp, num, id, nl] = m;
    if (nl) { lines.push([]); ln++; continue; }
    if (com) {
      const keep = m.index < headerEnd;
      com.split('\n').forEach((part, i) => {
        if (i) { lines.push([]); ln++; }
        if (keep) push(`<span class="t-com">${esc(part)}</span>`);
        else if (lines[ln - 1].join('').trim() === '') hidden.add(ln);   // 주석 앞에 코드가 없으면 주석 전용 줄
      });
    }
    else if (str) push(`<span class="t-str">${esc(str)}</span>`);
    else if (hdr) push(`<span class="t-hdr">${esc(hdr)}</span>`);
    else if (pp)  push(`<span class="t-pp">${esc(pp)}</span>`);
    else if (num) push(`<span class="t-num">${num}</span>`);
    else if (id) {
      const key = ALIAS[id] || (SYM[id] ? id : null);
      if (key) push(mark(key, id, KW.has(id) ? 'kw' : (id === 'sa' || id === 'sa_handler') ? 'var' : (ALIAS[id] && SYM[key].kind === 'var' ? 'type' : SYM[key].kind)));
      else push(KW.has(id) ? `<span class="t-kw">${id}</span>` : esc(id));
    }
    else if (OPS[t] && SYM[OPS[t]] && SRC[re.lastIndex] !== '=' && SRC[re.lastIndex] !== t) push(mark(OPS[t], t, 'op'));
    else push(esc(t));
  }
  document.getElementById('code').innerHTML = lines.map((parts, i) => {
    const n = i + 1;
    if (hidden.has(n)) return '';
    const src = parts.join('').replace(/\s+$/, '');                    // 줄 끝 주석을 지운 뒤 남은 공백 제거
    return `<div class="line" id="L${n}" data-role="${roleOfLine(n)}"><span class="ln">${n}</span><span class="src">${src || ' '}</span></div>`;
  }).join('');
}

/* ============================================================
 * 5. 우측 패널
 * ============================================================ */
const panel = document.getElementById('panel');
let simTimer = null;

function roleBadge(role) {
  const r = ROLES[role]; if (!r) return '';
  return `<span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ${r.soft} ${r.text}"><span class="w-1.5 h-1.5 rounded-full ${r.color}"></span>${r.label}</span>`;
}

/* 함수 카드 본문: 파라미터 → 리턴값 → 동작 → 실패 원인 → 관련 변수/함수 */
function funcBody(s) {
  const table = (head, rows, nowrapFirst = true) => `<div class="overflow-x-auto"><table>
      <tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>
      ${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 0 && nowrapFirst ? 'whitespace-nowrap' : ''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const relList = items => items.length ? `<div class="divide-y divide-slate-100 border border-slate-200 rounded-lg">${items.map(([k, why]) => `
      <div class="flex items-center gap-3 px-3 py-2 text-sm">
        ${SYM[k] ? `<button class="mono text-xs px-2 py-1 rounded border border-amber-300 bg-amber-50 hover:bg-amber-100 flex-none" data-go="${k}">${SYM[k].title || k}</button>`
                 : `<span class="mono text-xs px-2 py-1 rounded border border-slate-200 bg-slate-50 flex-none">${k}</span>`}
        <span class="text-slate-600">${why}</span></div>`).join('')}</div>` : '<p class="text-sm text-slate-500">없음</p>';
  return `
    <h3>📥 파라미터</h3>
    ${s.params.length ? table(['이름', '타입', '이 코드에서 넘긴 값', '설명'], s.params.map(([n, t, v, d]) => [`<code>${n}</code>`, `<span class="mono text-xs">${esc(t)}</span>`, v, d]))
                      : '<p class="text-sm text-slate-500">파라미터 없음</p>'}
    ${s.paramNote ? `<p class="text-sm mt-2">${s.paramNote}</p>` : ''}
    <h3>📤 리턴값</h3>
    ${table(['값', '의미', '이 코드에서의 처리'], s.ret)}
    ${s.retNote ? `<p class="text-sm mt-2">${s.retNote}</p>` : ''}
    <h3>⚙ 동작</h3>${s.how}
    <h3>⚠ 실패 원인 분석</h3>
    ${table(['원인', '증상 / errno', '이 코드에서 일어나는 일', '대처'], s.fails, false)}
    ${s.failNote ? `<p class="text-sm mt-2 rounded-lg bg-amber-50 border border-amber-200 px-3 py-2">${s.failNote}</p>` : ''}
    <h3>🔗 관련 변수 · 상수</h3>${relList(s.vars)}
    <h3>🔗 관련 함수</h3>${relList(s.funcs)}`;
}

function showSymbol(key, fromCode = false) {
  const s = SYM[key]; if (!s) return;
  stopSim();
  document.querySelectorAll('.sym.active, .sym.rel').forEach(e => e.classList.remove('active', 'rel'));
  document.querySelectorAll(`.sym[data-sym="${key}"]`).forEach(e => e.classList.add('active'));
  if (s.kind === 'func')    /* 관련 변수·함수를 코드에서도 표시 */
    [...s.vars, ...s.funcs].forEach(([k]) => document.querySelectorAll(`.sym[data-sym="${k}"]`).forEach(e => e.classList.add('rel')));

  const k = KIND[s.kind];
  const lines = OCC[key] ? [...OCC[key]].sort((a,b)=>a-b) : [];
  panel.innerHTML = `
    <button class="text-sm link mb-4" data-overview>← 전체 개요</button>
    <div class="flex flex-wrap items-center gap-2 mb-2">
      <span class="text-xs px-2 py-0.5 rounded ${k.cls}">${k.label}</span>${roleBadge(s.role)}
    </div>
    <h2 class="text-2xl font-bold mono text-slate-900 break-all">${s.title || key}</h2>
    <div class="mono text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded px-3 py-2 mt-2 overflow-x-auto whitespace-pre">${esc(s.sig)}</div>
    <p class="mt-3 text-[15px]">${s.summary}</p>
    ${lines.length ? `<div class="mt-3 text-sm text-slate-500">등장 줄: ${lines.map(n => `<span class="link mono mr-1.5" data-line="${n}">L${n}</span>`).join('')}</div>` : ''}
    ${s.kind === 'func' ? funcBody(s) : ''}
    ${(s.sections || []).map(([h, body]) => (h ? `<h3>${h}</h3>` : '<div class="mt-4"></div>') + body).join('')}
    ${s.regs ? `<h3>📍 관련 레지스터 (BCM2711)</h3>${s.regs.map(regDiagram).join('')}` : ''}
    ${s.extra || ''}
    ${s.related && s.related.length ? `<h3>관련 심볼</h3><div class="flex flex-wrap gap-1.5">${s.related.filter(r => SYM[r]).map(r =>
        `<button class="mono text-xs px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-go="${r}">${SYM[r].title || r}</button>`).join('')}</div>` : ''}
    <div class="h-10"></div>`;
  panel.scrollTop = 0;
  if (lines.length && !fromCode) scrollToLine(lines[0], true);
}

    <p class="mt-3 text-[15px]">${OVERVIEW.summary}</p>
    ${OVERVIEW.sim ? `
    <div class="mt-5 rounded-xl border border-slate-200 p-4 flex items-center gap-5">
      <div id="led" class="w-10 h-10 rounded-full bg-slate-300 border-4 border-slate-200 flex-none"></div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold">${OVERVIEW.sim.title}</div>
        <div id="simInfo" class="mono text-xs text-slate-500 mt-1 truncate">${OVERVIEW.sim.intro}</div>
      </div>
      <button id="btnSim" class="text-sm px-3 py-1.5 rounded-md bg-emerald-600 text-white hover:bg-emerald-500 flex-none">▶ 재생</button>
    </div>` : ''}

    <h3>🧭 실행 흐름 (역할별)</h3>
    <div class="space-y-1">${SECTIONS.filter(s => s.title).map(s => `
      <div class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-slate-50 cursor-pointer" data-line="${s.from}" data-to="${s.to}">
        <span class="w-2.5 h-2.5 rounded-full ${ROLES[s.role].color} flex-none"></span>
        <span class="mono text-xs text-slate-400 w-14 flex-none">L${s.from}${s.to!==s.from?'–'+s.to:''}</span>
        <span class="text-sm"><b>${s.title}</b> <span class="text-slate-500">${s.desc}</span></span>
      </div>`).join('')}</div>

    <h3>👀 보는 법</h3>
    <ul class="list-disc pl-5 text-sm text-slate-600">
      <li>왼쪽 코드에서 <b>밑줄 친 이름</b>을 클릭하면 여기에 상세 카드가 나온다.
        <span class="mono text-sky-600">함수</span> · <span class="mono text-emerald-600">변수</span> · <span class="mono text-yellow-600">매크로</span> · <span class="mono text-teal-600">상수</span> · <span class="mono text-rose-500">연산자(! ? &amp;)</span></li>
      <li>코드 왼쪽 세로 색 띠 = 그 줄의 역할 (초기화 / 메인 루프 / 지연 / 종료 / 정리)</li>
      <li><kbd class="mono text-xs border rounded px-1">Esc</kbd> 또는 상단 <b>전체 개요</b> 버튼 → 이 화면으로</li>
    </ul>
    <div class="h-10"></div>`;
  panel.scrollTop = 0;
  if (OVERVIEW.sim) document.getElementById('btnSim').onclick = toggleSim;
}

/* 루프 시뮬레이션: OVERVIEW.sim 의 from~to 줄을 ms 마다 강조하고 on/off 문구를 번갈아 보여 준다 */
function toggleSim() { simTimer ? stopSim() : startSim(); }
function startSim() {
  const sim = OVERVIEW.sim;
  let on = 0;
  const btn = document.getElementById('btnSim'), led = document.getElementById('led'), info = document.getElementById('simInfo');
  btn.textContent = '■ 정지'; btn.classList.replace('bg-emerald-600', 'bg-rose-600');
  const tick = () => {
    on = !on;
    led.classList.toggle('on', on);
    info.innerHTML = on ? sim.on : sim.off;
    flashLines(sim.from, sim.to, sim.ms * 0.9);
  };
  tick(); simTimer = setInterval(tick, sim.ms);
}
function stopSim() {
  if (!simTimer) return;
  clearInterval(simTimer); simTimer = null;
  const btn = document.getElementById('btnSim'), led = document.getElementById('led'), info = document.getElementById('simInfo');
  if (btn) { btn.textContent = '▶ 재생'; btn.classList.replace('bg-rose-600', 'bg-emerald-600'); }
  if (led) led.classList.remove('on');
  if (info) info.innerHTML = OVERVIEW.sim.stop;
}

/* ============================================================
 * 6. 줄 이동 / 강조
 * ============================================================ */
function scrollToLine(n, flash = true, to = n) {
  let el = null;                                 // 숨겨진(주석 전용) 줄이면 아래쪽 가장 가까운 줄로
  for (let i = n; !el && i <= Math.max(to, n) + 5; i++) el = document.getElementById('L' + i);
  if (!el) return;
  const box = document.getElementById('code');
  box.scrollTo({ top: el.offsetTop - box.clientHeight / 3, behavior: 'smooth' });
  if (flash) flashLines(n, to, 1200);
}
function flashLines(from, to, ms) {
  for (let i = from; i <= to; i++) {
    const el = document.getElementById('L' + i); if (!el) continue;
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), ms);
  }
}

/* ============================================================
 * 7. 이벤트
 * ============================================================ */
document.addEventListener('click', e => {
  const sym = e.target.closest('.sym');
  if (sym) { showSymbol(sym.dataset.sym, true); return; }
  const go = e.target.closest('[data-go]');
  if (go) { showSymbol(go.dataset.go); return; }
  const line = e.target.closest('[data-line]');
  if (line) { scrollToLine(+line.dataset.line, true, +(line.dataset.to || line.dataset.line)); return; }
  if (e.target.closest('[data-overview]')) showOverview();
});
document.getElementById('btnOverview').onclick = showOverview;
document.addEventListener('keydown', e => { if (e.key === 'Escape') showOverview(); });

document.getElementById('legend').innerHTML = ['init','loop','delay','shutdown','cleanup']
  .map(r => `<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full ${ROLES[r].color}"></span>${ROLES[r].label}</span>`).join('');

document.getElementById('subtitle').textContent = META.subtitle;
renderCode();
const start = decodeURIComponent(location.hash.slice(1));
SYM[start] ? showSymbol(start) : showOverview();
</script>
</body>
</html>
